<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="manifest" href="manifest.json">

        @keyframes slideUpModal { from { transform: translateY(100%); } to { transform: translateY(0); } }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ─── Constantes ───
const COLORS = [
  "#082B66","#1BC7C9","#F0786A","#E8A838","#9B6DD7","#4CAF50","#FF7043","#5C6BC0",
  "#26A69A","#EF5350","#AB47BC","#42A5F5",
  "#F8BBD0","#F48FB1","#EC407A","#AD1457","#E91E63",
  "#CE93D8","#7E57C2","#29B6F6","#26C6DA","#66BB6A",
  "#FFA726","#FFF176","#90A4AE","#880E4F"
];
const MONTHS_FR = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const DAYS_FR = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const DAYS_FULL = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const DEFAULT_CARE_TYPES = ["Pansement","Injection","Perfusion","Prise de sang","Surveillance","Glycémie","Insuline","Toilette","Douche","Aide au lever","Habillage / Déshabillage","Distribution médicaments","Pose bas de contention","Changement pansement","Changement capteur","Changement poche","Changement autre","Vidange drain","Vidange poche","Vidange autre","Éducation thérapeutique","Soins de stomie","Autre"];

// ─── Helpers ───
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtDate = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const getMonday = (d) => { const dt = new Date(d); const day = dt.getDay(); dt.setDate(dt.getDate() - ((day+6)%7)); dt.setHours(0,0,0,0); return dt; };
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
const HOURS = Array.from({length:17}, (_,i) => i+5);
const timeToY = (t) => { if(!t) return 0; const [h,m] = t.split(":").map(Number); return ((h-5) + m/60); };

function useStore(key, init) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
  });
  useEffect(() => { localStorage.setItem(key, JSON.stringify(val)); }, [key, val]);
  return [val, setVal];
}

// ─── Export helpers ───
function exportExcel(sheets, filename) {
  try {
    const XL = window.XLSX;
    if(!XL) throw new Error("XLSX not loaded");
    const wb = XL.utils.book_new();
    sheets.forEach(({name, rows}) => {
      const ws = XL.utils.aoa_to_sheet(rows);
      const colW = rows[0]?.map((_, ci) => Math.max(...rows.map(r => String(r[ci]||'').length)) + 2) || [];
      ws['!cols'] = colW.map(w => ({wch: Math.min(w, 40)}));
      XL.utils.book_append_sheet(wb, ws, name.slice(0,31));
    });
    XL.writeFile(wb, filename);
    return true;
  } catch(e) {
    console.error('Export Excel error:', e);
    alert("Export Excel échoué. Tentative en CSV...");
    const csv = sheets[0].rows.map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename.replace('.xlsx','.csv'); a.click();
    return false;
  }
}

function exportPDF(title, htmlContent) {
  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${title}</title>
    <style>body{font-family:Arial,sans-serif;padding:20px;font-size:12px}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid #ccc;padding:6px 8px;text-align:left}th{background:#082B66;color:#fff;font-size:11px}h1{color:#082B66;font-size:18px}h2{color:#1BC7C9;font-size:14px}.meta{color:#8B95A5;font-size:11px}@media print{button{display:none}}</style>
  </head><body><h1>${title}</h1>${htmlContent}<br><button onclick="window.print()">🖨️ Imprimer / PDF</button></body></html>`);
  win.document.close();
}

function sendVia(type, to, subject, body) {
  if(type === 'email') {
    window.open(`mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`);
  } else if(type === 'sms') {
    window.open(`sms:${to}?body=${encodeURIComponent(body)}`);
  }
}

function ExportBar({ onExcel, onPDF, onEmail, onSMS, emailTo, phoneTo }) {
  return (
    <div style={{display:'flex', gap:4, flexWrap:'wrap', marginBottom:10}}>
      {onExcel && <Btn variant="ghost" onClick={onExcel} style={{fontSize:11, padding:'5px 8px'}}>📥 Excel</Btn>}
      {onPDF && <Btn variant="ghost" onClick={onPDF} style={{fontSize:11, padding:'5px 8px'}}>📄 PDF</Btn>}
      {emailTo && onEmail && <Btn variant="ghost" onClick={onEmail} style={{fontSize:11, padding:'5px 8px'}}>✉️ Email</Btn>}
      {phoneTo && onSMS && <Btn variant="ghost" onClick={onSMS} style={{fontSize:11, padding:'5px 8px'}}>💬 SMS</Btn>}
    </div>
  );
}

// ─── Anonymisation patient ───
const ANON_MODES = [
  {value:"initials", label:"Initiales (AB, CD...)"},
  {value:"number", label:"Patient 1, 2, 3..."},
  {value:"cabinet", label:"Cabinet+N° (CabMartin1...)"},
  {value:"custom", label:"Libre"}
];
function getAnonLabel(patient, index, mode, cabName) {
  switch(mode) {
    case "number": return `Patient ${index+1}`;
    case "cabinet": return `${(cabName||"Cab").replace(/\s/g,'').slice(0,8)}${index+1}`;
    case "initials": default: return patient.initials || `P${index+1}`;
  }
}
function exportCSV(rows, filename) {
  const csv = rows.map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

// ─── UI Primitives ───
function Btn({ children, onClick, variant="primary", style={}, disabled, icon: Icon, full }) {
  const styles = {
    primary: { background:"#082B66", color:"#fff" },
    turquoise: { background:"#1BC7C9", color:"#fff" },
    danger: { background:"#FEE2E2", color:"#EF5350" },
    ghost: { background:"#F0F1F4", color:"#1A2332" },
    outline: { background:"transparent", color:"#082B66", border:"1.5px solid #082B66" }
  };
  return (
    <button onClick={onClick} disabled={disabled} style={{
      border:"none", borderRadius:12, padding:"11px 18px", fontWeight:600, fontSize:14,
      cursor: disabled ? "not-allowed" : "pointer", display:"inline-flex", alignItems:"center",
      justifyContent:"center", gap:6, transition:"all .15s", opacity: disabled ? .5 : 1,
      width: full ? "100%" : undefined,
      ...styles[variant], ...style
    }}>{Icon && <Icon size={16}/>}{children}</button>
  );
}

function Input({ label, value, onChange, type="text", placeholder, style={}, options, textarea, checked, onCheck }) {
  const shared = { width:"100%", padding:"10px 12px", borderRadius:10, border:"1.5px solid #E0E3EA", fontSize:14, outline:"none", fontFamily:"inherit", background:"#FAFBFC", transition:"border .15s" };
  return (
    <div style={{ marginBottom:12, ...style }}>
      {label && <label style={{ fontSize:12, fontWeight:600, color:"#5A6578", display:"block", marginBottom:4 }}>{label}</label>}
      {options ? (
        <select value={value||""} onChange={e=>onChange(e.target.value)} style={{...shared, appearance:"auto"}}>{options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}</select>
      ) : textarea ? (
        <textarea value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={3} style={{...shared, resize:"vertical"}} />
      ) : (
        <input type={type} value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={shared} onFocus={e=>{e.target.style.borderColor="#1BC7C9"}} onBlur={e=>{e.target.style.borderColor="#E0E3EA"}} />
      )}
    </div>
  );
}

function Checkbox({ label, checked, onChange, style={} }) {
  return (
    <label style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer', fontSize:13, color:'#1A2332', padding:'6px 0', ...style }}>
      <input type="checkbox" checked={checked||false} onChange={e=>onChange(e.target.checked)} style={{width:18, height:18, accentColor:'#1BC7C9', flexShrink:0}} />
      {label}
    </label>
  );
}

function Modal({ title, onClose, children, icon: Icon }) {
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(8,43,102,0.4)", zIndex:100, display:"flex", alignItems:"flex-end", justifyContent:"center" }}
      onClick={e => { if(e.target === e.currentTarget) onClose(); }}>
      <div style={{ background:"#fff", borderRadius:"20px 20px 0 0", width:"100%", maxWidth:500, maxHeight:"92vh", overflow:"auto", padding:"20px 20px 32px", animation:"slideUpModal .25s ease" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, position:"sticky", top:-20, background:"#fff", zIndex:2, paddingTop:4, paddingBottom:8 }}>
          <h3 style={{ margin:0, fontSize:18, fontWeight:700, color:"#082B66", display:'flex', alignItems:'center', gap:8 }}>
            {Icon && <Icon size={20} color="#1BC7C9" />} {title}
          </h3>
          <button onClick={onClose} style={{ background:"#F0F1F4", border:"none", borderRadius:10, padding:8, cursor:"pointer", fontSize:16 }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function KpiCard({ icon: Icon, label, value, sub, color, onClick, delay=0 }) {
  return (
    <div onClick={onClick} style={{
      background:"#fff", borderRadius:16, padding:"16px 14px", flex:"1 1 45%",
      minWidth:140, boxShadow:"0 2px 8px rgba(8,43,102,0.04)", border:"1px solid #F0F2F5",
      cursor: onClick ? "pointer" : "default", transition:"transform .15s, box-shadow .15s",
      opacity:0, animation: `slideUp 0.4s ease-out ${delay}s forwards`
    }} onMouseEnter={e=>{if(onClick){e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow="0 4px 16px rgba(8,43,102,0.1)"}}} onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="0 2px 8px rgba(8,43,102,0.04)"}}>
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:6 }}>
        <span style={{ fontSize:20 }}>{Icon}</span>
        <span style={{ fontSize:11, color:"#8B95A5", fontWeight:600, textTransform:"uppercase", letterSpacing:0.3 }}>{label}</span>
      </div>
      <div style={{ fontSize:22, fontWeight:700, color:"#082B66" }}>{value}</div>
      {sub && <div style={{ fontSize:11, color:"#8B95A5", marginTop:2 }}>{sub}</div>}
    </div>
  );
}

function Section({ title, children, action }) {
  return (
    <div style={{ marginBottom:20 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <h3 style={{ margin:0, fontSize:16, fontWeight:700, color:"#082B66" }}>{title}</h3>
        {action}
      </div>
      {children}
    </div>
  );
}

// ═══════════════════════════════════════════════
// DASHBOARD V1.1
// ═══════════════════════════════════════════════
function Dashboard({ remplacements, cabinets, params, setPage, openForm }) {
  const now = new Date();
  const month = now.getMonth(), year = now.getFullYear();
  const thisMonth = remplacements.filter(r => {
    const d = new Date(r.dateStart || r.date);
    return d.getMonth()===month && d.getFullYear()===year && r.status!=="cancelled";
  });

  // CA estimé = somme des montants prévus
  const caEstime = thisMonth.reduce((s,r) => s + (parseFloat(r.amountPlanned)||0), 0);
  // Revenus estimés = CA - rétrocessions
  const revenuEstime = thisMonth.reduce((s,r) => {
    const ca = parseFloat(r.amountPlanned)||0;
    const cab = cabinets.find(c => c.id === r.cabinetId);
    const retro = parseFloat(cab?.retroPercent)||0;
    return s + (ca * (1 - retro/100));
  }, 0);
  const totalKm = thisMonth.reduce((s,r) => s + (parseFloat(r.km)||0), 0);
  const activeCabs = new Set(thisMonth.map(r => r.cabinetId).filter(Boolean)).size;
  const joursRempla = thisMonth.length;

  // Prochaine tournée
  const todayStr = fmtDate(now);
  const upcoming = remplacements
    .filter(r => (r.dateStart || r.date) >= todayStr && r.status !== "cancelled")
    .sort((a,b) => (a.dateStart||a.date).localeCompare(b.dateStart||b.date));
  const next = upcoming[0];
  const nextCab = next ? cabinets.find(c => c.id === next.cabinetId) : null;
  const nextLabel = next
    ? `${new Date(next.dateStart||next.date).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})} — ${nextCab?.name||'?'}`
    : "Aucune";

  const userName = params.name?.split(' ')[0] || "";

  return (
    <div style={{ paddingBottom:20 }}>
      {/* Hero */}
      <div style={{
        background: 'linear-gradient(180deg, #F6FDFF 0%, #E5F9FF 20%, #B9EAF7 45%, #69C9E6 70%, #082B66 100%)',
        margin: '0 -16px 24px', padding: '8px 16px 20px',
        borderBottomLeftRadius: 32, borderBottomRightRadius: 32,
        textAlign: 'center', boxShadow: '0 8px 24px rgba(8,43,102,0.15)',
        animation: 'fadeInDown 0.6s ease-out'
      }}>
        <img src="assets/logo.png" alt="Rempla'IDEL" style={{ width:280, height:'auto', marginBottom:0, filter:'drop-shadow(0 4px 12px rgba(0,0,0,0.15))' }} />
        <h1 style={{ margin:0, fontSize:24, fontWeight:800, color:"white", letterSpacing:"-0.5px" }}>
          Bonjour {userName || "👋"}
        </h1>
        <p style={{ margin:"6px 0 0", fontSize:14, color:"rgba(255,255,255,0.9)", fontWeight:500 }}>Ton activité du jour</p>
        <div style={{ display:'flex', gap:8, justifyContent:'center', marginTop:16, flexWrap:'wrap' }}>
          <Btn onClick={() => openForm('')} style={{ background:'white', color:'#082B66', boxShadow:'0 4px 12px rgba(0,0,0,0.15)' }}>➕ Nouveau remplacement</Btn>
          <Btn onClick={() => setPage('plan')} style={{ background:'rgba(255,255,255,0.15)', color:'white', border:'1px solid rgba(255,255,255,0.4)' }}>📅 Planning</Btn>
        </div>
      </div>

      <div style={{ padding:'0 2px' }}>
        <h2 style={{ margin:"0 0 4px", fontSize:17, fontWeight:700, color:"#082B66" }}>
          {MONTHS_FR[month]} {year}
        </h2>
        <p style={{ margin:"0 0 14px", fontSize:12, color:"#8B95A5" }}>Résumé de ton mois</p>

        <div style={{ display:"flex", flexWrap:"wrap", gap:10 }}>
          <KpiCard icon="💶" label="CA estimé" value={`${caEstime.toFixed(0)} €`} onClick={()=>setPage('fin')} delay={0.05} />
          <KpiCard icon="💰" label="Revenus estimés" value={`${revenuEstime.toFixed(0)} €`} onClick={()=>setPage('fin')} delay={0.1} />
          <KpiCard icon="🚗" label="Kilomètres" value={`${totalKm.toFixed(0)} km`} onClick={()=>setPage('km')} delay={0.15} />
          <KpiCard icon="🏥" label="Cabinets actifs" value={activeCabs} onClick={()=>setPage('cabs')} delay={0.2} />
          <KpiCard icon="📅" label="Jours de rempla" value={joursRempla} onClick={()=>setPage('plan')} delay={0.25} />
          <KpiCard icon="🧑‍⚕️" label="Prochaine tournée" value={nextLabel} onClick={()=>setPage('plan')} delay={0.3} />
        </div>
      </div>

      <div style={{ textAlign:'center', marginTop:28, fontSize:11, color:'#B0B8C4' }}>
        Version 1.1 · ✨ Powered by IA
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// CABINETS V1.1
// ═══════════════════════════════════════════════
function Cabinets({ cabinets, setCabinets, remplacements, setPage }) {
  const [editing, setEditing] = useState(null);
  const [viewing, setViewing] = useState(null);
  const empty = {
    name:"", color:COLORS[1], address:"", phone:"", email:"", notes:"",
    contratStatus:"none", contratDateSignature:"", contratDatePrevue:"", contratNotes:"",
    cps:false, cpsRecuperee:false, cpsRendue:false, cpsNotes:"",
    accesType:"none", cleRecuperee:false, cleRendue:false, code:"", accesNotes:"",
    retroPercent:"", software:"", hours:""
  };
  function save(c) {
    if(!c.name.trim()) return;
    if(c.id) setCabinets(prev => prev.map(x => x.id===c.id ? c : x));
    else setCabinets(prev => [...prev, { ...c, id:uid() }]);
    setEditing(null);
  }
  function del(id) { setCabinets(prev => prev.filter(x => x.id!==id)); setViewing(null); }

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
        <h2 style={{ margin:0, fontSize:20, fontWeight:700, color:"#082B66" }}>Cabinets</h2>
        <Btn onClick={()=>setEditing({...empty})}>➕ Ajouter</Btn>
      </div>
      {cabinets.length===0 && <p style={{ color:"#8B95A5", textAlign:"center", padding:32 }}>Aucun cabinet. Commencez par en créer un !</p>}
      <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
        {cabinets.map(c => {
          const statusIcon = c.contratStatus==="signed" ? "✅" : c.contratStatus==="pending" ? "⏳" : "";
          return (
            <div key={c.id} onClick={()=>setViewing(c)} style={{ background:"#fff", borderRadius:14, padding:"14px 16px", cursor:"pointer", borderLeft:`4px solid ${c.color}`, display:"flex", alignItems:"center", gap:12, boxShadow:"0 2px 6px rgba(0,0,0,0.03)" }}>
              <div style={{ width:36, height:36, borderRadius:10, background:c.color+"20", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18 }}>🏥</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontWeight:600, fontSize:15, color:"#1A2332", display:'flex', gap:6, alignItems:'center' }}>
                  <span style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{c.name}</span>
                  {statusIcon && <span style={{fontSize:12}}>{statusIcon}</span>}
                </div>
                {c.address && <div style={{ fontSize:11, color:"#8B95A5", marginTop:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>📍 {c.address}</div>}
                {c.retroPercent && <div style={{ fontSize:11, color:"#1BC7C9", marginTop:1 }}>Rétro : {c.retroPercent}%</div>}
              </div>
              <span style={{color:"#C0C5D0", fontSize:16}}>›</span>
            </div>
          );
        })}
      </div>

      {viewing && (
        <Modal title={viewing.name} onClose={()=>setViewing(null)}>
          <CabinetDetail cab={viewing} onEdit={()=>{setViewing(null);setEditing(viewing)}} onDelete={()=>del(viewing.id)} />
        </Modal>
      )}
      {editing && (
        <Modal title={editing.id ? "Modifier" : "Nouveau cabinet"} onClose={()=>setEditing(null)}>
          <CabinetForm cabinet={editing} onSave={save} onCancel={()=>setEditing(null)} />
        </Modal>
      )}
    </div>
  );
}

function CabinetDetail({ cab, onEdit, onDelete }) {
  const Row = ({icon, label, value}) => value ? <div style={{fontSize:14, display:'flex', gap:8, alignItems:'flex-start', padding:'4px 0'}}><span>{icon}</span><div><span style={{fontWeight:600, color:'#5A6578', fontSize:12}}>{label}</span><br/>{value}</div></div> : null;
  const contratLabel = cab.contratStatus==="signed" ? "✅ Signé" : cab.contratStatus==="pending" ? "⏳ En attente" : "❌ Aucun";

  return (
    <div>
      <div style={{display:'flex', flexDirection:'column', gap:4, marginBottom:16}}>
        <Row icon="📍" label="Adresse" value={cab.address} />
        <Row icon="📞" label="Téléphone" value={cab.phone} />
        <Row icon="✉️" label="Email" value={cab.email} />
        <Row icon="💻" label="Logiciel" value={cab.software} />
        <Row icon="🕐" label="Horaires" value={cab.hours} />
        {cab.retroPercent && <Row icon="💶" label="Rétrocession" value={`${cab.retroPercent} %`} />}
      </div>

      <div style={{background:'#F8FAFC', borderRadius:12, padding:14, marginBottom:12}}>
        <div style={{fontWeight:700, fontSize:13, color:'#082B66', marginBottom:8}}>📋 Contrat</div>
        <div style={{fontSize:13}}>{contratLabel}</div>
        {cab.contratDateSignature && <div style={{fontSize:12, color:'#8B95A5'}}>Signé le : {new Date(cab.contratDateSignature).toLocaleDateString('fr-FR')}</div>}
        {cab.contratDatePrevue && <div style={{fontSize:12, color:'#8B95A5'}}>Prévu le : {new Date(cab.contratDatePrevue).toLocaleDateString('fr-FR')}</div>}

        ) : <div style={{fontSize:13, color:'#8B95A5'}}>Non concerné</div>}

        {cab.accesType==="cle" ? (
          <div style={{fontSize:13}}>
            Clé — Récupérée : {cab.cleRecuperee ? "✅" : "❌"} · Rendue : {cab.cleRendue ? "✅" : "❌"}
          </div>
        ) : cab.accesType==="code" ? (
          <div style={{fontSize:13}}>Code : {cab.code || "—"}</div>
        ) : <div style={{fontSize:13, color:'#8B95A5'}}>Non renseigné</div>}
        {cab.accesNotes && <div style={{fontSize:12, color:'#5A6578', marginTop:4}}>{cab.accesNotes}</div>}
      </div>

      {cab.notes && <div style={{padding:12, background:'#F7F8FA', borderRadius:10, fontSize:13, marginBottom:16}}>{cab.notes}</div>}

      <div style={{display:'flex', gap:10}}>
        <Btn onClick={onEdit}>✏️ Modifier</Btn>
        <Btn variant="danger" onClick={onDelete}>🗑️ Supprimer</Btn>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// PLANNING V1.1 — texte tronqué, noms courts
// ═══════════════════════════════════════════════
function Planning({ remplacements, setRemplacements, cabinets, onAdd, onEdit, onOpenTour }) {
  const [view, setView] = useState("month");
  const [cur, setCur] = useState(new Date());
  const today = new Date();
  const cabMap = useMemo(() => Object.fromEntries(cabinets.map(c=>[c.id,c])), [cabinets]);

  const nav = (dir) => {
    if(view==="month") setCur(new Date(cur.getFullYear(), cur.getMonth()+dir, 1));
    else if(view==="week") setCur(addDays(cur, dir*7));
    else setCur(addDays(cur, dir));
  };
  const navLabel = () => {
    if(view==="month") return `${MONTHS_FR[cur.getMonth()]} ${cur.getFullYear()}`;
    if(view==="week") { const m = getMonday(cur); return `${m.getDate()}–${addDays(m,6).getDate()} ${MONTHS_FR[m.getMonth()]}`; }
    return `${DAYS_FULL[(cur.getDay()+6)%7]} ${cur.getDate()} ${MONTHS_FR[cur.getMonth()]}`;
  };

  const eventsForDate = useCallback((dateStr) => {
    return remplacements.filter(r => {
      if(r.status === "cancelled") return false;
      const start = r.dateStart || r.date;
      const end = r.dateEnd || r.date || start;
      return dateStr >= start && dateStr <= end;
    });
  }, [remplacements]);

  // Nom tronqué pour le planning (initiales si trop long en vue mois)
  const shortName = (name, compact) => {
    if(!name) return "—";
    if(!compact) return name.length > 18 ? name.slice(0,16)+"…" : name;
    // Vue mois : initiales si > 6 chars
    if(name.length <= 6) return name;
    return name.split(/\s+/).map(w=>w[0]).join('').toUpperCase();
  };

  const EventChip = ({ ev, compact }) => {
    const cab = cabMap[ev.cabinetId];
    return (
      <div onClick={(e) => { e.stopPropagation(); onEdit(ev); }}
        style={{
          fontSize: compact ? 9 : 12, padding: compact ? "1px 3px" : "3px 6px",
          borderRadius: compact ? 4 : 6, marginBottom: compact ? 1 : 3,
          background: cab ? cab.color+"18" : "#F0F1F4",
          color: cab?.color || "#5A6578", fontWeight:600, cursor:"pointer",
          whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis",
          borderLeft: compact ? "none" : `3px solid ${cab?.color||"#8B95A5"}`,
          lineHeight: compact ? "14px" : "18px", maxWidth:"100%"
        }}>
        {compact ? shortName(cab?.name, true) : (
          <>{ev.start && <span style={{opacity:.7}}>{ev.start} </span>}{shortName(cab?.name, false)}</>
        )}
      </div>
    );
  };

  const MonthView = () => {
    const month = cur.getMonth(), year = cur.getFullYear();
    const startDay = (new Date(year, month, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const cells = [];
    for(let i=0; i<startDay; i++) cells.push(null);
    for(let d=1; d<=daysInMonth; d++) cells.push(d);
    return (
      <>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:2, marginBottom:4 }}>
          {DAYS_FR.map(d => <div key={d} style={{ textAlign:"center", fontSize:10, fontWeight:600, color:"#8B95A5", padding:2 }}>{d}</div>)}
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:3 }}>
          {cells.map((day, i) => {
            if(!day) return <div key={`e${i}`} />;
            const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
            const isToday = dateStr === fmtDate(today);
            const evts = eventsForDate(dateStr);
            return (
              <div key={day} onClick={() => { if(evts.length>=1) { setCur(new Date(dateStr)); setView("day"); } else onAdd(dateStr); }}
                style={{ minHeight:50, borderRadius:8, padding:3, cursor:"pointer", overflow:'hidden',
                  background: isToday ? "#E0F7FA" : "#fff",
                  border: isToday ? "2px solid #1BC7C9" : "1px solid #ECEEF2" }}>
                <div style={{ fontSize:11, fontWeight: isToday ? 700 : 500, color: isToday ? "#082B66" : "#1A2332", textAlign:"right", marginBottom:1 }}>{day}</div>
                {evts.slice(0,2).map(ev => <EventChip key={ev.id+dateStr} ev={ev} compact />)}
                {evts.length > 2 && <div style={{ fontSize:8, color:"#8B95A5", textAlign:'center' }}>+{evts.length-2}</div>}
              </div>
            );
          })}
        </div>
      </>
    );
  };

  const WeekView = () => {
    const mon = getMonday(cur);
    const days = Array.from({length:7}, (_,i) => addDays(mon, i));
    return (
      <div style={{ display:"flex", gap:3, overflowX:"auto", paddingBottom:8 }}>
        {days.map((d, i) => {
          const dateStr = fmtDate(d); const isToday = dateStr === fmtDate(today);
          const evts = eventsForDate(dateStr);
          return (
            <div key={i} style={{ flex:"1 0 0", minWidth:56, background: isToday ? "#E0F7FA" : "#fff", borderRadius:10, border: isToday ? "2px solid #1BC7C9" : "1px solid #ECEEF2", padding:5, minHeight:200 }}>
              <div style={{ textAlign:"center", marginBottom:6 }}>
                <div style={{ fontSize:10, fontWeight:600, color:"#8B95A5" }}>{DAYS_FR[i]}</div>
                <div style={{ fontSize:14, fontWeight:700, color: isToday ? "#fff" : "#1A2332", background: isToday ? "#082B66" : "transparent", borderRadius:20, width:26, height:26, lineHeight:"26px", margin:"2px auto" }}>{d.getDate()}</div>
              </div>
              {evts.sort((a,b)=>(a.start||"").localeCompare(b.start||"")).map(ev => <EventChip key={ev.id+dateStr} ev={ev} compact={false} />)}
              <div onClick={()=>onAdd(dateStr)} style={{ textAlign:"center", padding:4, cursor:"pointer", color:"#1BC7C9", fontSize:18, borderRadius:6 }}>+</div>
            </div>
          );
        })}
      </div>
    );
  };

  const DayView = () => {
    const dateStr = fmtDate(cur);
    const evts = eventsForDate(dateStr).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
    return (
      <div style={{ background:"#fff", borderRadius:14, border:"1px solid #ECEEF2", overflow:"hidden" }}>
        <div style={{ position:"relative", minHeight: HOURS.length * 44 }}>
          {HOURS.map(h => (
            <div key={h} onClick={()=>onAdd(dateStr)} style={{ height:44, borderBottom:"1px solid #F5F6F8", display:"flex", alignItems:"flex-start", padding:"2px 8px", cursor:"pointer" }}>
              <span style={{ fontSize:11, color:"#8B95A5", fontWeight:500, minWidth:36 }}>{String(h).padStart(2,"0")}:00</span>
            </div>
          ))}
          {evts.filter(ev=>ev.start).map(ev => {
            const top = timeToY(ev.start)*44;
            const height = ev.end ? (timeToY(ev.end)-timeToY(ev.start))*44 : 44;
            const cab = cabMap[ev.cabinetId];
            return (
              <div key={ev.id} onClick={(e)=>{e.stopPropagation();onEdit(ev)}}
                style={{ position:"absolute", top, left:44, right:8, height:Math.max(height,28), background:cab?cab.color+"20":"#F0F1F4", borderLeft:`4px solid ${cab?.color||"#8B95A5"}`, borderRadius:8, padding:"4px 8px", cursor:"pointer", fontSize:13, fontWeight:600, color:cab?.color||"#5A6578", overflow:"hidden", zIndex:2 }}>
                <div>{ev.start}–{ev.end||"?"} <span style={{fontWeight:500}}>{cab?.name||"—"}</span></div>
                {ev.notes && <div style={{fontSize:10,opacity:.6,marginTop:1}}>{ev.notes}</div>}
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  return (
    <div>
      <div style={{ display:"flex", background:"#ECEEF2", borderRadius:10, padding:2, marginBottom:10, gap:2 }}>
        {[["month","Mois"],["week","Semaine"],["day","Jour"]].map(([v,l]) => (
          <button key={v} onClick={()=>setView(v)} style={{ flex:1, padding:"7px 0", borderRadius:8, border:"none", fontSize:13, fontWeight:600, cursor:"pointer", background: view===v ? "#fff" : "transparent", color: view===v ? "#082B66" : "#8B95A5", boxShadow: view===v ? "0 1px 3px rgba(0,0,0,.06)" : "none" }}>{l}</button>
        ))}
      </div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
        <button onClick={()=>nav(-1)} style={{ background:"none", border:"none", cursor:"pointer", padding:6, color:"#082B66", fontSize:18 }}>◂</button>
        <h2 style={{ margin:0, fontSize:15, fontWeight:700, textAlign:"center", flex:1, color:"#082B66" }}>{navLabel()}</h2>
        <button onClick={()=>nav(1)} style={{ background:"none", border:"none", cursor:"pointer", padding:6, color:"#082B66", fontSize:18 }}>▸</button>
      </div>
      <div style={{ marginBottom:10 }}>
        <Btn variant="ghost" onClick={()=>setCur(new Date())} style={{ fontSize:12, padding:"6px 12px" }}>Aujourd'hui</Btn>
      </div>
      {view==="month" && <MonthView />}
      {view==="week" && <WeekView />}
      {view==="day" && <DayView />}
      <Btn full onClick={()=>onAdd(view==="day"?fmtDate(cur):"")} style={{ marginTop:14 }}>➕ Nouveau remplacement</Btn>
    </div>
  );
}

// ═══════════════════════════════════════════════
// FORMULAIRE REMPLACEMENT V1.1 — multi-jours + 3 créneaux
// ═══════════════════════════════════════════════
function ReplacementForm({ replacement, cabinets, params, onSave, onDelete, onCancel }) {
  const [r, setR] = useState(replacement);
  const up = (k,v) => setR(p=>({...p,[k]:v}));
  const cabOptions = [{ value:"", label:"— Choisir —" }, ...cabinets.map(c=>({ value:c.id, label:c.name }))];
  const statusOptions = [{value:"pending",label:"En attente"},{value:"partial",label:"Payé partiellement"},{value:"paid",label:"Payé totalement"},{value:"cancelled",label:"Annulé"}];
  const careTypeOptions = (params.careTypes || DEFAULT_CARE_TYPES).map(t => ({ value: t, label: t }));

  const addPatient = () => {
    up("patients", [...(r.patients || []), { id:uid(), initials:"", careType:careTypeOptions[0]?.value||"", time:"", slot:"matin", done:false, notes:"" }]);
  };
  const updatePatient = (id, key, val) => up("patients", r.patients.map(p => p.id===id ? {...p,[key]:val} : p));
  const removePatient = (id) => up("patients", r.patients.filter(p => p.id!==id));

  return (
    <div>
      <div style={{ display:"flex", gap:10 }}>
        <Input label="Date début *" type="date" value={r.dateStart||r.date} onChange={v=>{up("dateStart",v); if(!r.dateEnd) up("dateEnd",v);}} style={{flex:1}} />
        <Input label="Date fin" type="date" value={r.dateEnd||r.date} onChange={v=>up("dateEnd",v)} style={{flex:1}} />
      </div>

      <div style={{background:'#F8FAFC', borderRadius:12, padding:12, marginBottom:14}}>
        <div style={{fontWeight:600, fontSize:13, color:'#082B66', marginBottom:8}}>🌅 Matin</div>
        <div style={{display:'flex', gap:8}}>
          <Input label="Début" type="time" value={r.startMatin} onChange={v=>up("startMatin",v)} style={{flex:1}} />
          <Input label="Fin" type="time" value={r.endMatin} onChange={v=>up("endMatin",v)} style={{flex:1}} />
        </div>
      </div>
      <div style={{background:'#F8FAFC', borderRadius:12, padding:12, marginBottom:14}}>
        <div style={{fontWeight:600, fontSize:13, color:'#082B66', marginBottom:8}}>🌙 Soir</div>
        <div style={{display:'flex', gap:8}}>
          <Input label="Début" type="time" value={r.startSoir} onChange={v=>up("startSoir",v)} style={{flex:1}} />
          <Input label="Fin" type="time" value={r.endSoir} onChange={v=>up("endSoir",v)} style={{flex:1}} />
        </div>
      </div>

      {/* Compat ancien format : garder start/end pour le planning */}
      {(() => { if(!r.start && r.startMatin) { r.start = r.startMatin; r.end = r.endSoir || r.endMatin; } return null; })()}

      <Input label="Cabinet" value={r.cabinetId} onChange={v=>up("cabinetId",v)} options={cabOptions} />
      <Input label="Statut" value={r.status} onChange={v=>up("status",v)} options={statusOptions} />
      <div style={{display:'flex', gap:10}}>
        <Input label="CA prévu (€)" type="number" value={r.amountPlanned} onChange={v=>up("amountPlanned",v)} style={{flex:1}} />
        <Input label="CA reçu (€)" type="number" value={r.amountReceived} onChange={v=>up("amountReceived",v)} style={{flex:1}} />
      </div>
      <Input label="Kilomètres" type="number" value={r.km} onChange={v=>up("km",v)} />

      {/* PATIENTS / TOURNÉE */}
      <div style={{ marginBottom:16, padding:14, background:'#F8FAFC', borderRadius:12, border:'1px dashed #E0E3EA' }}>
        <Checkbox label="Activer le suivi patients (tournée)" checked={r.trackPatients} onChange={v=>up("trackPatients",v)} style={{fontWeight:600, color:'#082B66'}} />
      </div>
      {r.trackPatients && (
        <div style={{marginBottom:16}}>
          <h3 style={{fontSize:15, fontWeight:700, marginBottom:10, color:'#082B66'}}>Patients prévus</h3>
          {r.patients?.map((p,idx) => (
            <div key={p.id} style={{background:'#fff', border:'1px solid #E0E3EA', borderRadius:10, padding:10, marginBottom:8}}>
              <div style={{display:'flex', justifyContent:'space-between', marginBottom:6}}>
                <span style={{fontSize:12, fontWeight:600, color:'#8B95A5'}}>Patient {idx+1}</span>
                <button onClick={()=>removePatient(p.id)} style={{background:'none', border:'none', color:'#EF5350', cursor:'pointer', fontSize:12}}>🗑️</button>
              </div>
              <div style={{display:'flex', gap:6, marginBottom:6}}>
                <Input label="Initiales" value={p.initials} onChange={v=>updatePatient(p.id,"initials",v)} placeholder="AB" style={{flex:1, marginBottom:0}} />
                <Input label="Heure" type="time" value={p.time} onChange={v=>updatePatient(p.id,"time",v)} style={{flex:1, marginBottom:0}} />
                <Input label="Créneau" value={p.slot} onChange={v=>updatePatient(p.id,"slot",v)} options={[{value:"matin",label:"Matin"},{value:"soir",label:"Soir"}]} style={{flex:1, marginBottom:0}} />
              </div>
              <Input label="Type de soin" value={p.careType} onChange={v=>updatePatient(p.id,"careType",v)} options={careTypeOptions} style={{marginBottom:6}} />
              <Input label="Notes" value={p.notes} onChange={v=>updatePatient(p.id,"notes",v)} textarea style={{marginBottom:0}} />
            </div>
          ))}
          <Btn variant="turquoise" full onClick={addPatient} style={{marginTop:6}}>➕ Ajouter un patient</Btn>
        </div>
      )}

      <Input label="Observations générales" value={r.notes} onChange={v=>up("notes",v)} textarea />
      <div style={{ display:"flex", gap:10, marginTop:8 }}>
        <Btn onClick={()=>{
          // Sync ancien format pour planning
          const out = {...r};
          if(!out.date) out.date = out.dateStart;
          if(!out.start && out.startMatin) out.start = out.startMatin;
          if(!out.end) out.end = out.endSoir || out.endMatin;
          onSave(out);
        }} disabled={!(r.dateStart||r.date)}>✅ Enregistrer</Btn>
        {r.id && onDelete && <Btn variant="danger" onClick={()=>onDelete(r.id)}>🗑️</Btn>}
        <Btn variant="ghost" onClick={onCancel}>Annuler</Btn>
      </div>
    </div>
  );
}

// FINANCES V1.2 — CA éditable, graphique barres, satisfaction cabinet
// ═══════════════════════════════════════════════
function BarChart({ data, labelKey, valueKey, secondKey, colors, height=180 }) {
  if(!data || data.length===0) return null;
  const maxVal = Math.max(...data.map(d => Math.max(d[valueKey]||0, d[secondKey]||0)), 1);
  return (
    <div style={{background:'#fff', borderRadius:12, padding:14, border:'1px solid #ECEEF2', marginBottom:14}}>
      <div style={{display:'flex', alignItems:'flex-end', gap:6, height, paddingBottom:24, position:'relative'}}>
        {data.map((d,i) => {
          const h1 = ((d[valueKey]||0)/maxVal)*height*0.85;
          const h2 = secondKey ? ((d[secondKey]||0)/maxVal)*height*0.85 : 0;
          return (
            <div key={i} style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'flex-end', gap:2, height:'100%'}}>
              <div style={{fontSize:9, fontWeight:700, color:'#082B66'}}>{(d[valueKey]||0).toFixed(0)}€</div>
              <div style={{display:'flex', gap:1, alignItems:'flex-end', width:'100%', justifyContent:'center'}}>
                <div style={{width: secondKey ? '45%' : '70%', height:Math.max(h1,2), background:colors?.[0]||'#082B66', borderRadius:'4px 4px 0 0', transition:'height .3s'}} />
                {secondKey && <div style={{width:'45%', height:Math.max(h2,2), background:colors?.[1]||'#1BC7C9', borderRadius:'4px 4px 0 0', transition:'height .3s'}} />}
              </div>
              <div style={{fontSize:8, color:'#8B95A5', textAlign:'center', position:'absolute', bottom:0, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', maxWidth: `${100/data.length}%`}}>{d[labelKey]}</div>
            </div>
          );
        })}
      </div>
      {secondKey && (
        <div style={{display:'flex', gap:12, justifyContent:'center', marginTop:8, fontSize:11}}>
          <span style={{display:'flex', alignItems:'center', gap:4}}><span style={{width:10,height:10,borderRadius:2,background:colors?.[0]||'#082B66',display:'inline-block'}} />Prévu</span>
          <span style={{display:'flex', alignItems:'center', gap:4}}><span style={{width:10,height:10,borderRadius:2,background:colors?.[1]||'#1BC7C9',display:'inline-block'}} />Reçu</span>
        </div>
      )}
    </div>
  );
}

function SatisfactionGauge({ score, size=60 }) {
  // score 0-5
  const pct = (score/5)*100;
  const color = score >= 4 ? "#4CAF50" : score >= 3 ? "#E8A838" : "#EF5350";
  return (
    <div style={{display:'flex', alignItems:'center', gap:8}}>
      <div style={{width:size, height:8, background:'#F0F1F4', borderRadius:4, overflow:'hidden'}}>
        <div style={{height:'100%', width:`${pct}%`, background:color, borderRadius:4}} />
      </div>
      <span style={{fontSize:13, fontWeight:700, color}}>{score.toFixed(1)}/5</span>
    </div>
  );
}

function Finances({ remplacements, setRemplacements, cabinets, setCabinets }) {
  const cabMap = Object.fromEntries(cabinets.map(c=>[c.id,c]));
  const [filterYear, setFilterYear] = useState(new Date().getFullYear());
  const [filterMonth, setFilterMonth] = useState(-1); // -1 = tous
  const [editingPayment, setEditingPayment] = useState(null);
  const [showSatisfaction, setShowSatisfaction] = useState(false);
  const [chartMode, setChartMode] = useState("months"); // months | cabinets
  const years = [...new Set(remplacements.map(r => new Date(r.dateStart||r.date).getFullYear()))].sort().reverse();
  if(years.length===0) years.push(filterYear);

  const filtered = remplacements.filter(r => {
    const d = new Date(r.dateStart||r.date);
    if(d.getFullYear()!==filterYear || r.status==="cancelled") return false;
    if(filterMonth >= 0 && d.getMonth() !== filterMonth) return false;
    return true;
  });

  const totalCA = filtered.reduce((s,r) => s+(parseFloat(r.amountPlanned)||0), 0);
  const totalRecu = filtered.reduce((s,r) => s+(parseFloat(r.amountReceived)||0), 0);
  const totalRetro = filtered.reduce((s,r) => {
    const ca = parseFloat(r.amountPlanned)||0;
    const cab = cabMap[r.cabinetId];
    const p = parseFloat(cab?.retroPercent)||0;
    return s + ca*p/100;
  }, 0);
  const revenuEstime = totalCA - totalRetro;
  const revenuRecu = totalRecu - filtered.reduce((s,r) => {
    const ca = parseFloat(r.amountReceived)||0;
    const cab = cabMap[r.cabinetId];
    return s + ca*(parseFloat(cab?.retroPercent)||0)/100;
  }, 0);

  // Par cabinet
  const byCab = {};
  filtered.forEach(r => {
    const cab = cabMap[r.cabinetId];
    const name = cab?.name || "Sans cabinet";
    const cid = r.cabinetId;
    if(!byCab[cid]) byCab[cid] = {name, planned:0, received:0, retro:0, count:0, color:cab?.color||"#8B95A5", retroP:parseFloat(cab?.retroPercent)||0};
    byCab[cid].planned += parseFloat(r.amountPlanned)||0;
    byCab[cid].received += parseFloat(r.amountReceived)||0;
    byCab[cid].retro += (parseFloat(r.amountPlanned)||0) * (parseFloat(cab?.retroPercent)||0) / 100;
    byCab[cid].count++;
  });

  // Par mois
  const byMonth = {};
  remplacements.filter(r => new Date(r.dateStart||r.date).getFullYear()===filterYear && r.status!=="cancelled").forEach(r => {
    const m = new Date(r.dateStart||r.date).getMonth();
    if(!byMonth[m]) byMonth[m] = {planned:0, received:0};
    byMonth[m].planned += parseFloat(r.amountPlanned)||0;
    byMonth[m].received += parseFloat(r.amountReceived)||0;
  });

  const chartDataMonths = Array.from({length:12},(_,m)=>({
    label: MONTHS_FR[m].slice(0,3), planned: byMonth[m]?.planned||0, received: byMonth[m]?.received||0
  })).filter(d => d.planned > 0 || d.received > 0);

  const chartDataCabs = Object.values(byCab).map(v => ({
    label: v.name.length > 8 ? v.name.slice(0,7)+'…' : v.name,
    planned: v.planned, received: v.received
  }));

  const RetroGauge = ({percent}) => {
    const color = percent <= 5 ? "#4CAF50" : percent <= 8 ? "#E8A838" : "#EF5350";
    const label = percent <= 5 ? "Faible" : percent <= 8 ? "Moyenne" : "Élevée";
    return (
      <div style={{display:'flex', alignItems:'center', gap:8}}>
        <div style={{flex:1, background:'#F0F1F4', borderRadius:6, height:10, overflow:'hidden'}}>
          <div style={{height:'100%', width:`${Math.min(percent*5,100)}%`, background:color, borderRadius:6, transition:'width .3s'}} />
        </div>
        <span style={{fontSize:11, fontWeight:600, color}}>{percent.toFixed(1)}% — {label}</span>
      </div>
    );
  };

  // Marquer paiement
  const savePayment = (replId, amountReceived, paymentStatus) => {
    setRemplacements(prev => prev.map(r => r.id===replId ? {...r, amountReceived, paymentStatus} : r));
    setEditingPayment(null);
  };

  // Satisfaction cabinet
  const SAT_KEYS = [
    {key:'satRetro', label:'Rétrocession'},
    {key:'satPhysique', label:'Impact physique'},
    {key:'satPsycho', label:'Impact psychologique'},
    {key:'satCharge', label:'Charge de travail'},
    {key:'satReactivite', label:'Réactivité'},
    {key:'satAdmin', label:'Gestion admin/technique'}
  ];
  const updateCabSat = (cabId, key, val) => {
    setCabinets(prev => prev.map(c => c.id===cabId ? {...c, [key]: val} : c));
  };
  const cabSatScore = (cab) => {
    const vals = SAT_KEYS.map(k => parseFloat(cab[k.key])||0).filter(v => v > 0);
    return vals.length > 0 ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
  };

  const handleExport = () => {
    const rows1 = [["Cabinet","Jours","CA prévu","CA reçu","Rétro %","Rétro €","Revenu estimé","Revenu reçu"]];
    Object.values(byCab).forEach(v => {
      rows1.push([v.name, v.count, v.planned.toFixed(2), v.received.toFixed(2), v.retroP, v.retro.toFixed(2), (v.planned-v.retro).toFixed(2), (v.received - v.received*v.retroP/100).toFixed(2)]);
    });
    rows1.push(["TOTAL","",totalCA.toFixed(2),totalRecu.toFixed(2),"",totalRetro.toFixed(2),revenuEstime.toFixed(2), revenuRecu.toFixed(2)]);

    const rows2 = [["Mois","CA prévu","CA reçu"]];
    for(let m=0;m<12;m++) rows2.push([MONTHS_FR[m], (byMonth[m]?.planned||0).toFixed(2), (byMonth[m]?.received||0).toFixed(2)]);

    exportExcel([{name:'Par cabinet', rows:rows1}, {name:'Par mois', rows:rows2}], `Finances_${filterYear}.xlsx`);
  };

  return (
    <div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14, flexWrap:'wrap', gap:6}}>
        <h2 style={{margin:0, fontSize:20, fontWeight:700, color:"#082B66"}}>Finances</h2>
        <div style={{display:'flex', gap:4, flexWrap:'wrap'}}>
          <select value={filterYear} onChange={e=>setFilterYear(parseInt(e.target.value))} style={{padding:'5px 8px', borderRadius:8, border:'1px solid #E0E3EA', fontSize:12, fontWeight:600}}>
            {years.map(y => <option key={y} value={y}>{y}</option>)}
          </select>
          <select value={filterMonth} onChange={e=>setFilterMonth(parseInt(e.target.value))} style={{padding:'5px 8px', borderRadius:8, border:'1px solid #E0E3EA', fontSize:12, fontWeight:600}}>
            <option value={-1}>Tous les mois</option>
            {MONTHS_FR.map((m,i) => <option key={i} value={i}>{m}</option>)}
          </select>
          <Btn variant="ghost" onClick={handleExport} style={{fontSize:11, padding:'5px 8px'}}>📥 Excel</Btn>
        </div>
      </div>

      <div style={{display:"flex", flexWrap:"wrap", gap:10, marginBottom:14}}>
        <KpiCard icon="📈" label="CA prévu" value={`${totalCA.toFixed(0)} €`} delay={0.05} />
        <KpiCard icon="💶" label="CA reçu" value={`${totalRecu.toFixed(0)} €`} delay={0.1}
          onClick={()=>{/* scroll to unpaid list */}} />
        <KpiCard icon="💰" label="Revenu estimé" value={`${revenuEstime.toFixed(0)} €`} sub={`Rétro : ${totalRetro.toFixed(0)} €`} delay={0.15} />
        <KpiCard icon="⏳" label="Reste dû" value={`${(totalCA-totalRecu).toFixed(0)} €`} delay={0.2} />
      </div>

      {totalCA > 0 && (
        <div style={{background:'#fff', borderRadius:12, padding:14, marginBottom:14, border:'1px solid #ECEEF2'}}>
          <div style={{fontSize:13, fontWeight:600, color:'#082B66', marginBottom:8}}>Rétrocession globale</div>
          <RetroGauge percent={totalCA > 0 ? totalRetro/totalCA*100 : 0} />
        </div>
      )}

      {/* GRAPHIQUE BARRES */}
      <div style={{display:'flex', gap:4, marginBottom:8}}>
        <Btn variant={chartMode==="months"?"primary":"ghost"} onClick={()=>setChartMode("months")} style={{fontSize:11, padding:'5px 10px'}}>Par mois</Btn>
        <Btn variant={chartMode==="cabinets"?"primary":"ghost"} onClick={()=>setChartMode("cabinets")} style={{fontSize:11, padding:'5px 10px'}}>Par cabinet</Btn>
      </div>
      <BarChart
        data={chartMode==="months" ? chartDataMonths : chartDataCabs}
        labelKey="label" valueKey="planned" secondKey="received"
        colors={['#082B66','#1BC7C9']}
      />

      {/* SUIVI PAIEMENTS — liste des remplacements impayés */}
      <Section title="💶 Suivi paiements" action={<span style={{fontSize:11, color:'#8B95A5'}}>{filtered.filter(r=>r.status!=="paid" && (parseFloat(r.amountPlanned)||0)>0).length} en attente</span>}>
        {filtered.filter(r => r.status!=="paid" && (parseFloat(r.amountPlanned)||0)>0).slice(0,10).map(r => {
          const cab = cabMap[r.cabinetId];
          const date = new Date(r.dateStart||r.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
          return (
            <div key={r.id} onClick={()=>setEditingPayment(r)} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 12px', background:'#fff', borderRadius:10, marginBottom:6, border:'1px solid #ECEEF2', cursor:'pointer'}}>
              <div>
                <div style={{fontWeight:600, fontSize:13, color:'#1A2332'}}>{date} — {cab?.name||"?"}</div>
                <div style={{fontSize:11, color:'#8B95A5'}}>Prévu : {r.amountPlanned}€ · Reçu : {r.amountReceived||0}€</div>
              </div>
              <span style={{fontSize:12, fontWeight:600, color:r.paymentStatus==="partial"?"#E8A838":"#EF5350"}}>{r.paymentStatus==="partial" ? "Partiel" : "Impayé"}</span>
            </div>
          );
        })}
      </Section>

      {/* Modal paiement */}
      {editingPayment && (
        <Modal title="Enregistrer un paiement" onClose={()=>setEditingPayment(null)}>
          <PaymentEditor rep={editingPayment} cabMap={cabMap} onSave={savePayment} onCancel={()=>setEditingPayment(null)} />
        </Modal>
      )}

      {/* PAR CABINET */}
      <Section title="Par cabinet">
        {Object.entries(byCab).map(([cid,v]) => (
          <div key={cid} style={{background:'#fff', borderRadius:10, padding:'12px 14px', marginBottom:8, border:'1px solid #ECEEF2'}}>
            <div style={{display:'flex', justifyContent:'space-between', marginBottom:4}}>
              <span style={{fontWeight:600, fontSize:14, color:'#1A2332'}}>{v.name} ({v.count}j)</span>
              <span style={{fontWeight:700, color:'#082B66'}}>{v.planned.toFixed(0)} €</span>
            </div>
            <div style={{display:'flex', justifyContent:'space-between', fontSize:11, color:'#8B95A5', marginBottom:4}}>
              <span>Reçu : {v.received.toFixed(0)} €</span>
              <span>Rétro : {v.retro.toFixed(0)} € ({v.retroP}%)</span>
            </div>
            <RetroGauge percent={v.retroP} />
          </div>
        ))}
        {Object.keys(byCab).length===0 && <p style={{color:"#8B95A5", fontSize:13}}>Aucune donnée</p>}
      </Section>

      {/* INDICE SATISFACTION CABINET */}
      <Section title="📊 Indice de satisfaction" action={<Btn variant="ghost" onClick={()=>setShowSatisfaction(!showSatisfaction)} style={{fontSize:11, padding:'4px 10px'}}>{showSatisfaction ? "Masquer" : "Évaluer"}</Btn>}>
        {cabinets.map(cab => {
          const score = cabSatScore(cab);
          return (
            <div key={cab.id} style={{background:'#fff', borderRadius:10, padding:'12px 14px', marginBottom:8, border:'1px solid #ECEEF2'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>
                <span style={{fontWeight:600, fontSize:14, color:cab.color||'#1A2332'}}>{cab.name}</span>
                <SatisfactionGauge score={score} />
              </div>
              {showSatisfaction && (
                <div style={{display:'flex', flexDirection:'column', gap:6, marginTop:8}}>
                  {SAT_KEYS.map(({key, label}) => (
                    <div key={key} style={{display:'flex', alignItems:'center', gap:8}}>
                      <span style={{fontSize:11, color:'#5A6578', width:120, flexShrink:0}}>{label}</span>
                      <div style={{display:'flex', gap:2}}>
                        {[1,2,3,4,5].map(v => (
                          <button key={v} onClick={()=>updateCabSat(cab.id, key, v)} style={{
                            width:28, height:28, borderRadius:6, border:'none', cursor:'pointer', fontSize:12, fontWeight:700,
                            background: (parseFloat(cab[key])||0)>=v ? '#082B66' : '#F0F1F4',
                            color: (parseFloat(cab[key])||0)>=v ? '#fff' : '#8B95A5'
                          }}>{v}</button>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </Section>
    </div>
  );
}

function PaymentEditor({ rep, cabMap, onSave, onCancel }) {
  const [amount, setAmount] = useState(rep.amountReceived || "");
  const [status, setStatus] = useState(rep.paymentStatus || "none");
  const cab = cabMap[rep.cabinetId];
  const planned = parseFloat(rep.amountPlanned)||0;

  return (
    <div>
      <div style={{fontSize:14, color:'#1A2332', marginBottom:12}}>
        <strong>{cab?.name||"?"}</strong> — {new Date(rep.dateStart||rep.date).toLocaleDateString('fr-FR')}<br/>
        CA prévu : <strong>{planned} €</strong>
        {cab?.retroPercent && <span style={{color:'#8B95A5'}}> (rétro {cab.retroPercent}% = {(planned*parseFloat(cab.retroPercent)/100).toFixed(0)}€)</span>}
      </div>
      <div style={{display:'flex', gap:6, marginBottom:12}}>
        {[{v:"complete",l:"✅ Complet"},{v:"partial",l:"⚠️ Partiel"}].map(({v,l}) => (
          <button key={v} onClick={()=>{setStatus(v); if(v==="complete") setAmount(String(planned));}} style={{
            flex:1, padding:'10px', borderRadius:10, border: status===v ? '2px solid #082B66' : '1.5px solid #E0E3EA',
            background: status===v ? '#082B66' : '#fff', color: status===v ? '#fff' : '#1A2332',
            fontWeight:600, fontSize:13, cursor:'pointer'
          }}>{l}</button>
        ))}
      </div>
      <Input label="Montant reçu (€)" type="number" value={amount} onChange={setAmount} placeholder={String(planned)} />
      <div style={{display:'flex', gap:10, marginTop:8}}>
        <Btn onClick={()=>onSave(rep.id, amount, status)}>💾 Enregistrer</Btn>
        <Btn variant="ghost" onClick={onCancel}>Annuler</Btn>
      </div>
    </div>
  );
}

// KILOMÉTRAGE V1.2 — ajout km/jour cliquable, exports Excel
// ═══════════════════════════════════════════════
function Kilometres({ remplacements, setRemplacements, cabinets, params }) {
  const cabMap = Object.fromEntries(cabinets.map(c=>[c.id,c]));
  const [filterYear, setFilterYear] = useState(new Date().getFullYear());
  const [filterMonth, setFilterMonth] = useState(-1);
  const [editingKm, setEditingKm] = useState(null);
  const years = [...new Set(remplacements.map(r => new Date(r.dateStart||r.date).getFullYear()))].sort().reverse();
  if(years.length===0) years.push(filterYear);

  const yearData = remplacements.filter(r => {
    const d = new Date(r.dateStart||r.date);
    if(d.getFullYear()!==filterYear || r.status==="cancelled") return false;
    if(filterMonth >= 0 && d.getMonth()!==filterMonth) return false;
    return true;
  });

  const totalKm = yearData.reduce((s,r) => s+(parseFloat(r.km)||0), 0);
  const byCab = {};
  yearData.forEach(r => {
    const name = cabMap[r.cabinetId]?.name || "Sans cabinet";
    if(!byCab[name]) byCab[name] = {km:0, count:0};
    byCab[name].km += parseFloat(r.km)||0;
    byCab[name].count++;
  });
  const byMonth = {};
  remplacements.filter(r => new Date(r.dateStart||r.date).getFullYear()===filterYear && r.status!=="cancelled").forEach(r => {
    const m = new Date(r.dateStart||r.date).getMonth();
    if(!byMonth[m]) byMonth[m] = {km:0, count:0};
    byMonth[m].km += parseFloat(r.km)||0;
    byMonth[m].count++;
  });

  const saveKm = (replId, km) => {
    setRemplacements(prev => prev.map(r => r.id===replId ? {...r, km} : r));
    setEditingKm(null);
  };

  const handleExportMonthly = (m) => {
    const monthData = remplacements.filter(r => {
      const d = new Date(r.dateStart||r.date);
      return d.getFullYear()===filterYear && d.getMonth()===m && r.status!=="cancelled";
    });
    const rows = [["Date","Cabinet","Kilomètres","Notes"]];
    monthData.sort((a,b)=>(a.dateStart||a.date).localeCompare(b.dateStart||b.date)).forEach(r => {
      rows.push([new Date(r.dateStart||r.date).toLocaleDateString('fr-FR'), cabMap[r.cabinetId]?.name||"?", r.km||0, r.notes||""]);
    });
    rows.push(["TOTAL","",monthData.reduce((s,r)=>s+(parseFloat(r.km)||0),0).toFixed(0),""]);
    exportExcel([{name:MONTHS_FR[m], rows}], `Km_${MONTHS_FR[m]}_${filterYear}.xlsx`);
  };

  const handleExportAnnuel = () => {
    const rows1 = [["Mois","Kilomètres","Jours"]];
    for(let m=0;m<12;m++) rows1.push([MONTHS_FR[m], (byMonth[m]?.km||0).toFixed(0), byMonth[m]?.count||0]);
    rows1.push(["TOTAL", totalKm.toFixed(0), yearData.length]);
    const rows2 = [["Cabinet","Kilomètres","Jours"]];
    Object.entries(byCab).forEach(([n,v])=>rows2.push([n, v.km.toFixed(0), v.count]));
    const rows3 = [["Date","Cabinet","Kilomètres"]];
    remplacements.filter(r=>new Date(r.dateStart||r.date).getFullYear()===filterYear && r.status!=="cancelled")
      .sort((a,b)=>(a.dateStart||a.date).localeCompare(b.dateStart||b.date))
      .forEach(r=>rows3.push([new Date(r.dateStart||r.date).toLocaleDateString('fr-FR'), cabMap[r.cabinetId]?.name||"?", r.km||0]));
    exportExcel([{name:'Synthèse', rows:rows1}, {name:'Par cabinet', rows:rows2}, {name:'Détail', rows:rows3}], `Km_Annuel_${filterYear}.xlsx`);
  };

  return (
    <div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14, flexWrap:'wrap', gap:6}}>
        <h2 style={{margin:0, fontSize:20, fontWeight:700, color:"#082B66"}}>Kilométrage</h2>
        <div style={{display:'flex', gap:4, flexWrap:'wrap'}}>
          <select value={filterYear} onChange={e=>setFilterYear(parseInt(e.target.value))} style={{padding:'5px 8px', borderRadius:8, border:'1px solid #E0E3EA', fontSize:12, fontWeight:600}}>
            {years.map(y=><option key={y} value={y}>{y}</option>)}
          </select>
          <select value={filterMonth} onChange={e=>setFilterMonth(parseInt(e.target.value))} style={{padding:'5px 8px', borderRadius:8, border:'1px solid #E0E3EA', fontSize:12, fontWeight:600}}>
            <option value={-1}>Année</option>
            {MONTHS_FR.map((m,i)=><option key={i} value={i}>{m}</option>)}
          </select>
          <Btn variant="ghost" onClick={handleExportAnnuel} style={{fontSize:11, padding:'5px 8px'}}>📥 Excel</Btn>
          <Btn variant="ghost" onClick={()=>{
            let html = `<p class="meta">${filterYear}${filterMonth>=0 ? ' — '+MONTHS_FR[filterMonth] : ''}</p><h2>Total : ${totalKm.toFixed(0)} km</h2>`;
            html += '<h2>Par cabinet</h2><table><tr><th>Cabinet</th><th>Km</th><th>Jours</th></tr>';
            Object.entries(byCab).forEach(([n,v])=> html += `<tr><td>${n}</td><td>${v.km.toFixed(0)}</td><td>${v.count}</td></tr>`);
            html += '</table><h2>Par mois</h2><table><tr><th>Mois</th><th>Km</th><th>Jours</th></tr>';
            for(let m=0;m<12;m++) if(byMonth[m]) html += `<tr><td>${MONTHS_FR[m]}</td><td>${byMonth[m].km.toFixed(0)}</td><td>${byMonth[m].count}</td></tr>`;
            html += '</table>';
            exportPDF(`Kilométrage ${filterYear}`, html);
          }} style={{fontSize:11, padding:'5px 8px'}}>📄 PDF</Btn>
        </div>
      </div>

      <div style={{display:"flex", flexWrap:"wrap", gap:10, marginBottom:16}}>
        <KpiCard icon="🚗" label="Total km" value={`${totalKm.toFixed(0)} km`} delay={0.05} />
        <KpiCard icon="📊" label="Moy./jour" value={`${yearData.length>0 ? (totalKm/yearData.length).toFixed(0) : 0} km`} delay={0.1} />
        <KpiCard icon="📅" label="Jours roulés" value={yearData.filter(r=>(parseFloat(r.km)||0)>0).length} delay={0.15} />
      </div>

      {/* Liste des jours — cliquable pour ajouter/modifier km */}
      <Section title="Saisie km par jour" action={<span style={{fontSize:11, color:'#8B95A5'}}>Cliquer pour modifier</span>}>
        {yearData.sort((a,b)=>(b.dateStart||b.date).localeCompare(a.dateStart||a.date)).slice(0,20).map(r => {
          const cab = cabMap[r.cabinetId];
          const date = new Date(r.dateStart||r.date).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
          return (
            <div key={r.id} onClick={()=>setEditingKm(r)} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 12px', background:'#fff', borderRadius:10, marginBottom:5, border:'1px solid #ECEEF2', cursor:'pointer'}}>
              <div>
                <div style={{fontWeight:600, fontSize:13, color:'#1A2332'}}>{date}</div>
                <div style={{fontSize:11, color:cab?.color||'#8B95A5'}}>{cab?.name||"?"}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <span style={{fontWeight:700, fontSize:15, color: (parseFloat(r.km)||0)>0 ? '#082B66' : '#E0E3EA'}}>{r.km||0} km</span>
                {!(parseFloat(r.km)||0) && <div style={{fontSize:10, color:'#1BC7C9'}}>+ Ajouter</div>}
              </div>
            </div>
          );
        })}
      </Section>

      {/* Modal saisie km */}
      {editingKm && (
        <Modal title="Kilomètres du jour" onClose={()=>setEditingKm(null)}>
          <KmEditor rep={editingKm} cabMap={cabMap} onSave={saveKm} onCancel={()=>setEditingKm(null)} />
        </Modal>
      )}

      <Section title="Par cabinet">
        {Object.entries(byCab).sort((a,b)=>b[1].km-a[1].km).map(([name,v]) => (
          <div key={name} style={{display:'flex', justifyContent:'space-between', padding:'10px 14px', background:'#fff', borderRadius:10, marginBottom:6, border:'1px solid #ECEEF2'}}>
            <span style={{fontWeight:600, fontSize:14, color:'#1A2332'}}>{name}</span>
            <div style={{textAlign:'right'}}>
              <span style={{fontWeight:700, fontSize:14, color:'#082B66'}}>{v.km.toFixed(0)} km</span>
              <div style={{fontSize:11, color:'#8B95A5'}}>{v.count} jours</div>
            </div>
          </div>
        ))}
      </Section>

      <Section title="Par mois" action={<span style={{fontSize:10, color:'#8B95A5'}}>📥 cliquer pour exporter</span>}>
        {Array.from({length:12},(_,m)=>m).filter(m=>byMonth[m]).map(m => (
          <div key={m} onClick={()=>handleExportMonthly(m)} style={{display:'flex', justifyContent:'space-between', padding:'8px 14px', background:'#fff', borderRadius:8, marginBottom:4, border:'1px solid #F0F2F5', cursor:'pointer'}}>
            <span style={{fontSize:13, color:'#1A2332'}}>{MONTHS_FR[m]}</span>
            <div style={{display:'flex', gap:12, alignItems:'center'}}>
              <span style={{fontWeight:700, fontSize:13, color:'#082B66'}}>{(byMonth[m]?.km||0).toFixed(0)} km</span>
              <span style={{fontSize:11, color:'#8B95A5'}}>{byMonth[m]?.count||0}j</span>
              <span style={{fontSize:12}}>📥</span>
            </div>
          </div>
        ))}
      </Section>
    </div>
  );
}

function KmEditor({ rep, cabMap, onSave, onCancel }) {
  const [km, setKm] = useState(rep.km || "");
  const cab = cabMap[rep.cabinetId];
  return (
    <div>
      <div style={{fontSize:14, color:'#1A2332', marginBottom:12}}>
        <strong>{cab?.name||"?"}</strong> — {new Date(rep.dateStart||rep.date).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}
      </div>
      <Input label="Kilomètres (saisie libre)" type="number" value={km} onChange={setKm} placeholder="Ex: 137" />
      <div style={{fontSize:11, color:'#8B95A5', marginBottom:8}}>Raccourcis :</div>
      <div style={{display:'flex', gap:5, marginBottom:14, flexWrap:'wrap'}}>
        {[30,50,80,100,120,150,180,200].map(v => (
          <button key={v} onClick={()=>setKm(String(v))} style={{padding:'7px 12px', borderRadius:8, border: km===String(v) ? '2px solid #082B66' : '1.5px solid #E0E3EA', background: km===String(v)?'#082B66':'#fff', color: km===String(v)?'#fff':'#1A2332', fontSize:12, fontWeight:600, cursor:'pointer'}}>{v}</button>
        ))}
      </div>
      <div style={{display:'flex', gap:10}}>
        <Btn onClick={()=>onSave(rep.id, km)}>✅ Enregistrer</Btn>
        <Btn variant="ghost" onClick={onCancel}>Annuler</Btn>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// LISTING SOINS V2 — style tournée, édition directe inline
// ═══════════════════════════════════════════════
function ListingSoins({ remplacements, setRemplacements, cabinets, params }) {
  const cabMap = Object.fromEntries(cabinets.map(c=>[c.id,c]));
  const [anonMode, setAnonMode] = useState(params.anonMode || "initials");
  const [viewMode, setViewMode] = useState("day");
  const [viewDate, setViewDate] = useState(fmtDate(new Date()));
  const [addingTo, setAddingTo] = useState(null); // replId

  const allEntries = remplacements
    .filter(r => r.trackPatients && r.patients?.length > 0 && r.status !== "cancelled")
    .sort((a,b) => (a.dateStart||a.date||"").localeCompare(b.dateStart||b.date||""));

  const getFiltered = () => {
    if(viewMode === "day") return allEntries.filter(r => (r.dateStart||r.date) === viewDate);
    const mon = getMonday(new Date(viewDate));
    return allEntries.filter(r => {
      const d = r.dateStart||r.date;
      return d >= fmtDate(mon) && d <= fmtDate(addDays(mon, 6));
    });
  };
  const filtered = getFiltered();

  const navDate = (dir) => {
    const d = new Date(viewDate);
    d.setDate(d.getDate() + (viewMode==="day" ? dir : dir*7));
    setViewDate(fmtDate(d));
  };

  // Patient CRUD
  const updatePatient = (replId, patId, key, val) => {
    setRemplacements(prev => prev.map(r => r.id===replId ? {
      ...r, patients: r.patients.map(p => p.id===patId ? {...p, [key]:val} : p)
    } : r));
  };
  const removePatient = (replId, patId) => {
    if(!confirm("Supprimer ce patient ?")) return;
    setRemplacements(prev => prev.map(r => r.id===replId ? {
      ...r, patients: r.patients.filter(p => p.id!==patId)
    } : r));
  };
  const addPatient = (replId, slot) => {
    const careTypes = params.careTypes || DEFAULT_CARE_TYPES;
    setRemplacements(prev => prev.map(r => r.id===replId ? {
      ...r, patients: [...r.patients, { id:uid(), initials:"", careType:careTypes[0]||"", time:"", slot: slot||"matin", done:false, notes:"", difficulties:"", transmissions:"" }]
    } : r));
  };

  // Exports
  const buildRows = () => {
    const rows = [["Date","Cabinet","Patient","Heure","Créneau","Soin","Notes","Difficultés","Transmissions"]];
    filtered.forEach(r => {
      const cab = cabMap[r.cabinetId];
      const date = new Date(r.dateStart||r.date).toLocaleDateString('fr-FR');
      (r.patients||[]).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99")).forEach((p,idx) => {
        rows.push([date, cab?.name||"?", getAnonLabel(p,idx,anonMode,cab?.name), p.time||"", p.slot||"matin", p.careType||"", p.notes||"", p.difficulties||"", p.transmissions||""]);
      });
    });
    return rows;
  };
  const buildHTML = () => {
    let html = `<p class="meta">${viewMode==="day" ? new Date(viewDate).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) : 'Semaine du '+new Date(viewDate).toLocaleDateString('fr-FR')}</p>`;
    filtered.forEach(r => {
      const cab = cabMap[r.cabinetId];
      const matinP = (r.patients||[]).filter(p=>(p.slot||"matin")==="matin").sort((a,b)=>(a.time||"").localeCompare(b.time||""));
      const soirP = (r.patients||[]).filter(p=>p.slot==="soir").sort((a,b)=>(a.time||"").localeCompare(b.time||""));
      html += `<h2>Tournée — ${cab?.name||"?"}</h2><p class="meta">${new Date(r.dateStart||r.date).toLocaleDateString('fr-FR')}</p>`;
      if(matinP.length) { html += `<h3>🌅 Matin</h3><table><tr><th>Heure</th><th>Patient</th><th>Soin</th><th>Notes</th></tr>`; matinP.forEach((p,i)=>html+=`<tr><td>${p.time||""}</td><td><strong>${getAnonLabel(p,i,anonMode,cab?.name)}</strong></td><td>${p.careType}</td><td>${p.notes||""}</td></tr>`); html+='</table>'; }
      if(soirP.length) { html += `<h3>🌙 Soir</h3><table><tr><th>Heure</th><th>Patient</th><th>Soin</th><th>Notes</th></tr>`; soirP.forEach((p,i)=>html+=`<tr><td>${p.time||""}</td><td><strong>${getAnonLabel(p,i,anonMode,cab?.name)}</strong></td><td>${p.careType}</td><td>${p.notes||""}</td></tr>`); html+='</table>'; }
    });
    return html;
  };
  const buildText = () => {
    let t = `Tournée ${viewMode==="day" ? new Date(viewDate).toLocaleDateString('fr-FR') : 'semaine du '+new Date(viewDate).toLocaleDateString('fr-FR')}\n\n`;
    filtered.forEach(r => {
      const cab = cabMap[r.cabinetId];
      t += `${cab?.name||"?"}\n`;
      ['matin','soir'].forEach(slot => {
        const ps = (r.patients||[]).filter(p=>(p.slot||"matin")===slot);
        if(ps.length) { t += `  ${slot==='matin'?'🌅 Matin':'🌙 Soir'}\n`; ps.forEach((p,i)=>t+=`    ${p.time||"--:--"} ${getAnonLabel(p,i,anonMode,cab?.name)} — ${p.careType}${p.notes?' ('+p.notes+')':''}\n`); }
      });
      t += '\n';
    });
    return t;
  };
  const currentCab = filtered.length>0 ? cabMap[filtered[0].cabinetId] : null;
  const careTypes = params.careTypes || DEFAULT_CARE_TYPES;

  // Patient card component — style tournée
  const PatientCard = ({ p, idx, replId, cabName }) => {
    const label = getAnonLabel(p, idx, anonMode, cabName);
    return (
      <div style={{background:'#fff', borderRadius:12, padding:'12px 14px', marginBottom:8, border:'1px solid #ECEEF2', boxShadow:'0 1px 4px rgba(0,0,0,0.03)'}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8}}>
          <div style={{display:'flex', alignItems:'center', gap:8, flex:1, minWidth:0}}>
            <span style={{fontWeight:800, fontSize:14, color:'#1BC7C9', whiteSpace:'nowrap'}}>{p.time || "—"}</span>
            <input value={p.initials||""} onChange={e=>updatePatient(replId,p.id,"initials",e.target.value)}
              placeholder="Initiales" style={{fontWeight:700, fontSize:15, color:'#082B66', border:'none', borderBottom:'1.5px dashed #E0E3EA', background:'transparent', padding:'2px 4px', width:90, outline:'none'}} />
          </div>
          <button onClick={()=>removePatient(replId,p.id)} style={{background:'#FEE2E2', border:'none', borderRadius:8, padding:'4px 8px', cursor:'pointer', fontSize:12, color:'#EF5350', flexShrink:0}}>🗑️</button>
        </div>

        {/* Soin */}
        <select value={p.careType||""} onChange={e=>updatePatient(replId,p.id,"careType",e.target.value)}
          style={{width:'100%', padding:'8px 10px', borderRadius:8, border:'1.5px solid #E0E3EA', fontSize:13, fontWeight:600, color:'#1A2332', marginTop:8, background:'#FAFBFC', appearance:'auto'}}>
          {careTypes.map(t => <option key={t} value={t}>{t}</option>)}
        </select>

        {/* Métadonnées éditables */}
        <div style={{display:'flex', gap:6, marginTop:8}}>
          <input type="time" value={p.time||""} onChange={e=>updatePatient(replId,p.id,"time",e.target.value)}
            style={{padding:'5px 8px', borderRadius:6, border:'1px solid #E0E3EA', fontSize:12, flex:'0 0 90px'}} />
          <select value={p.slot||"matin"} onChange={e=>updatePatient(replId,p.id,"slot",e.target.value)}
            style={{padding:'5px 8px', borderRadius:6, border:'1px solid #E0E3EA', fontSize:12, flex:1, appearance:'auto'}}>
            <option value="matin">🌅 Matin</option>
            <option value="soir">🌙 Soir</option>
          </select>
        </div>

        {/* Notes, difficultés, transmissions — accordéon */}
        <div style={{marginTop:8}}>
          <textarea value={p.notes||""} onChange={e=>updatePatient(replId,p.id,"notes",e.target.value)}
            placeholder="Notes / consignes" rows={1} style={{width:'100%', padding:'6px 8px', borderRadius:6, border:'1px solid #E0E3EA', fontSize:11, resize:'vertical', fontFamily:'inherit'}} />
          {p.notes && (
            <div style={{background:'#FFF3E0', borderRadius:6, padding:'4px 8px', marginTop:4, fontSize:11, color:'#E65100'}}>
              {p.difficulties || p.transmissions ? `⚠️ ${p.difficulties||""} ${p.transmissions||""}` : ""}
            </div>
          )}
        </div>
      </div>
    );
  };

  return (
    <div>
      <h2 style={{margin:'0 0 10px', fontSize:22, fontWeight:800, color:"#082B66"}}>Tournée</h2>

      {/* Mode anonymisation compact */}
      <div style={{display:'flex', gap:3, marginBottom:10, flexWrap:'wrap'}}>
        {ANON_MODES.map(m => (
          <button key={m.value} onClick={()=>setAnonMode(m.value)} style={{
            padding:'4px 8px', borderRadius:6, fontSize:10, fontWeight:600, cursor:'pointer',
            border: anonMode===m.value ? '2px solid #082B66' : '1px solid #E0E3EA',
            background: anonMode===m.value ? '#082B66' : '#fff',
            color: anonMode===m.value ? '#fff' : '#8B95A5'
          }}>{m.label}</button>
        ))}
      </div>

      {/* Navigation */}
      <div style={{display:'flex', gap:4, marginBottom:8}}>
        <Btn variant={viewMode==="day"?"primary":"ghost"} onClick={()=>setViewMode("day")} style={{fontSize:11, padding:'5px 10px'}}>Jour</Btn>
        <Btn variant={viewMode==="week"?"primary":"ghost"} onClick={()=>setViewMode("week")} style={{fontSize:11, padding:'5px 10px'}}>Semaine</Btn>
      </div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
        <button onClick={()=>navDate(-1)} style={{background:'none', border:'none', cursor:'pointer', fontSize:18, color:'#082B66', padding:8}}>◂</button>
        <input type="date" value={viewDate} onChange={e=>setViewDate(e.target.value)} style={{border:'1.5px solid #E0E3EA', borderRadius:8, padding:'6px 12px', fontSize:14, fontWeight:700, color:'#082B66'}} />
        <button onClick={()=>navDate(1)} style={{background:'none', border:'none', cursor:'pointer', fontSize:18, color:'#082B66', padding:8}}>▸</button>
      </div>

      {/* Exports */}
      <ExportBar
        onExcel={()=>exportExcel([{name:'Tournée', rows:buildRows()}], `Tournee_${viewDate}.xlsx`)}
        onPDF={()=>exportPDF('Tournée', buildHTML())}
        onEmail={currentCab?.email ? ()=>sendVia('email', currentCab.email, `Transmissions ${new Date(viewDate).toLocaleDateString('fr-FR')}`, buildText()) : null}
        onSMS={currentCab?.phone ? ()=>sendVia('sms', currentCab.phone, '', buildText()) : null}
        emailTo={currentCab?.email} phoneTo={currentCab?.phone}
      />

      {filtered.length===0 && <div style={{textAlign:'center', padding:'40px 20px', color:'#8B95A5'}}>
        <div style={{fontSize:40, marginBottom:10}}>🩺</div>
        <p style={{fontSize:14, fontWeight:600}}>Aucune tournée ce jour</p>
        <p style={{fontSize:12}}>Créez un remplacement avec suivi patients activé.</p>
      </div>}

      {filtered.map(r => {
        const cab = cabMap[r.cabinetId];
        const date = new Date(r.dateStart||r.date).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
        const matinP = (r.patients||[]).filter(p=>(p.slot||"matin")==="matin").sort((a,b)=>(a.time||"").localeCompare(b.time||""));
        const soirP = (r.patients||[]).filter(p=>p.slot==="soir").sort((a,b)=>(a.time||"").localeCompare(b.time||""));

        return (
          <div key={r.id} style={{marginBottom:20}}>
            {/* En-tête tournée */}
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10, padding:'10px 14px', background:`${cab?.color||'#082B66'}12`, borderRadius:12, borderLeft:`4px solid ${cab?.color||'#082B66'}`}}>
              <div>
                <div style={{fontWeight:800, fontSize:16, color:'#082B66'}}>Tournée — <span style={{color:cab?.color||'#1BC7C9'}}>{cab?.name||"?"}</span></div>
                <div style={{fontSize:12, color:'#5A6578', marginTop:2}}>{date}</div>
              </div>
              {(cab?.email || cab?.phone) && (
                <div style={{display:'flex', gap:4}}>
                  {cab?.email && <button onClick={()=>sendVia('email',cab.email,`Transmissions ${date}`,buildText())} style={{background:'none',border:'1px solid #E0E3EA',borderRadius:8,padding:6,cursor:'pointer',fontSize:14}}>✉️</button>}
                  {cab?.phone && <button onClick={()=>sendVia('sms',cab.phone,'',buildText())} style={{background:'none',border:'1px solid #E0E3EA',borderRadius:8,padding:6,cursor:'pointer',fontSize:14}}>💬</button>}
                </div>
              )}
            </div>

            {/* MATIN */}
            <div style={{marginBottom:12}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>
                <h3 style={{margin:0, fontSize:15, fontWeight:700, color:'#082B66'}}>🌅 Matin <span style={{fontSize:12, fontWeight:500, color:'#8B95A5'}}>({matinP.length} patient{matinP.length>1?'s':''})</span></h3>
                <button onClick={()=>addPatient(r.id,"matin")} style={{background:'#E0F7FA', border:'none', borderRadius:8, padding:'5px 10px', cursor:'pointer', fontSize:12, fontWeight:600, color:'#00838F'}}>+ Patient</button>
              </div>
              {matinP.map((p,idx) => <PatientCard key={p.id} p={p} idx={idx} replId={r.id} cabName={cab?.name} />)}
              {matinP.length===0 && <p style={{fontSize:12, color:'#B0B8C4', padding:'8px 0', fontStyle:'italic'}}>Aucun patient le matin</p>}
            </div>

            {/* SOIR */}
            <div>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>
                <h3 style={{margin:0, fontSize:15, fontWeight:700, color:'#082B66'}}>🌙 Soir <span style={{fontSize:12, fontWeight:500, color:'#8B95A5'}}>({soirP.length} patient{soirP.length>1?'s':''})</span></h3>
                <button onClick={()=>addPatient(r.id,"soir")} style={{background:'#EDE7F6', border:'none', borderRadius:8, padding:'5px 10px', cursor:'pointer', fontSize:12, fontWeight:600, color:'#5E35B1'}}>+ Patient</button>
              </div>
              {soirP.map((p,idx) => <PatientCard key={p.id} p={p} idx={idx} replId={r.id} cabName={cab?.name} />)}
              {soirP.length===0 && <p style={{fontSize:12, color:'#B0B8C4', padding:'8px 0', fontStyle:'italic'}}>Aucun patient le soir</p>}
            </div>
          </div>
        );
      })}
    </div>
  );
}
