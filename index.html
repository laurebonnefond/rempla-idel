// PARAMÈTRES V1.1
// ═══════════════════════════════════════════════
// ═══════════════════════════════════════════════
// PARAMÈTRES V2 — sync, sauvegarde, IA dashboard
// ═══════════════════════════════════════════════
function Parametres({ params, setParams, remplacements, cabinets }) {
  const up = (k,v) => setParams(p=>({...p,[k]:v}));
  const [newCareType, setNewCareType] = useState("");
  const [importStatus, setImportStatus] = useState("");
  const [showIA, setShowIA] = useState(false);
  const careTypes = params.careTypes || DEFAULT_CARE_TYPES;
  const addCareType = () => { if(!newCareType.trim() || careTypes.includes(newCareType.trim())) return; up("careTypes",[...careTypes,newCareType.trim()]); setNewCareType(""); };
  const removeCareType = (t) => up("careTypes", careTypes.filter(x=>x!==t));
  const fileRef = useRef(null);

  // Full backup export
  const exportBackup = () => {
    const data = JSON.stringify({
      params, remplacements, cabinets,
      version:"2.0", exportDate: new Date().toISOString()
    }, null, 2);
    const blob = new Blob([data], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `remplaidel-backup-${fmtDate(new Date())}.json`;
    a.click();
  };

  // Import backup
  const importBackup = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if(!confirm(`Importer les données ?\n\n${data.remplacements?.length||0} remplacements\n${data.cabinets?.length||0} cabinets\n\n⚠️ Cela remplacera vos données actuelles.`)) return;
        if(data.params) setParams(data.params);
        if(data.remplacements) localStorage.setItem("ri_remplacements", JSON.stringify(data.remplacements));
        if(data.cabinets) localStorage.setItem("ri_cabinets", JSON.stringify(data.cabinets));
        setImportStatus("✅ Import réussi ! Rechargement...");
        setTimeout(() => window.location.reload(), 1500);
      } catch(err) {
        setImportStatus("❌ Fichier invalide");
      }
    };
    reader.readAsText(file);
  };

  // IA Dashboard — prévisions revenus
  const cabMap = Object.fromEntries(cabinets.map(c=>[c.id,c]));
  const now = new Date();
  const last3months = remplacements.filter(r => {
    const d = new Date(r.dateStart||r.date);
    const diff = (now - d) / (1000*60*60*24);
    return diff >= 0 && diff <= 90 && r.status !== "cancelled";
  });
  const avgCAperMonth = last3months.length > 0 ? last3months.reduce((s,r)=>s+(parseFloat(r.amountPlanned)||0),0) / 3 : 0;
  const avgKmPerMonth = last3months.length > 0 ? last3months.reduce((s,r)=>s+(parseFloat(r.km)||0),0) / 3 : 0;
  const topCab = Object.entries(last3months.reduce((acc,r) => {
    const n = cabMap[r.cabinetId]?.name || "?";
    acc[n] = (acc[n]||0) + (parseFloat(r.amountPlanned)||0);
    return acc;
  }, {})).sort((a,b)=>b[1]-a[1])[0];

  return (
    <div>
      <h2 style={{margin:"0 0 16px", fontSize:20, fontWeight:700, color:"#082B66"}}>Réglages</h2>

      {/* Identité */}
      <div style={{background:'#fff', borderRadius:14, padding:16, marginBottom:14, border:'1px solid #ECEEF2'}}>
        <h3 style={{fontSize:15, fontWeight:700, marginBottom:10, color:'#082B66'}}>👤 Identité</h3>
        <Input label="Nom IDEL" value={params.name} onChange={v=>up("name",v)} placeholder="Adeline Kotreba" />
        <Input label="Téléphone" value={params.phone} onChange={v=>up("phone",v)} type="tel" />
        <Input label="Email" value={params.email} onChange={v=>up("email",v)} type="email" />
        <Input label="Tarif journalier (€)" type="number" value={params.tarifJour} onChange={v=>up("tarifJour",v)} placeholder="300" />
      </div>

      {/* Types de soins */}
      <div style={{background:'#fff', borderRadius:14, padding:16, marginBottom:14, border:'1px solid #ECEEF2'}}>
        <h3 style={{fontSize:15, fontWeight:700, marginBottom:10, color:'#082B66'}}>🩺 Types de soins</h3>
        <div style={{display:'flex', flexWrap:'wrap', gap:4, marginBottom:10}}>
          {careTypes.map(t => (
            <div key={t} style={{display:'flex', alignItems:'center', gap:3, background:'#F0F1F4', borderRadius:20, padding:'3px 8px', fontSize:11, fontWeight:600}}>
              {t}
              <button onClick={()=>removeCareType(t)} style={{background:'none', border:'none', cursor:'pointer', color:'#EF5350', padding:0, fontSize:9}}>✕</button>
            </div>
          ))}
        </div>
        <div style={{display:'flex', gap:8}}>
          <Input value={newCareType} onChange={setNewCareType} placeholder="Nouveau soin..." style={{flex:1, marginBottom:0}} />
          <Btn onClick={addCareType}>➕</Btn>
        </div>
      </div>

      {/* Sauvegarde & Sync */}
      <div style={{background:'#fff', borderRadius:14, padding:16, marginBottom:14, border:'1px solid #ECEEF2'}}>
        <h3 style={{fontSize:15, fontWeight:700, marginBottom:10, color:'#082B66'}}>💾 Sauvegarde & Synchronisation</h3>
        <p style={{fontSize:12, color:'#5A6578', marginBottom:12}}>
          Exportez vos données pour les transférer entre téléphone et tablette, ou pour sauvegarder régulièrement.
        </p>
        <Btn full onClick={exportBackup} style={{marginBottom:8}}>📤 Exporter toutes les données (.json)</Btn>
        <Btn full variant="turquoise" onClick={()=>fileRef.current?.click()} style={{marginBottom:8}}>📥 Importer une sauvegarde</Btn>
        <input ref={fileRef} type="file" accept=".json" onChange={importBackup} style={{display:'none'}} />
        {importStatus && <div style={{fontSize:13, fontWeight:600, color: importStatus.includes('✅') ? '#4CAF50' : '#EF5350', padding:8, textAlign:'center'}}>{importStatus}</div>}
        <div style={{background:'#F0F8FF', borderRadius:10, padding:12, marginTop:8}}>
          <div style={{fontWeight:600, fontSize:12, color:'#082B66', marginBottom:4}}>📱↔️📱 Synchroniser entre appareils</div>
          <ol style={{fontSize:11, color:'#5A6578', margin:0, paddingLeft:16, lineHeight:'18px'}}>
            <li>Sur l'appareil source : <strong>Exporter</strong></li>
            <li>Transférer le fichier .json (email, Drive, AirDrop...)</li>
            <li>Sur l'appareil cible : <strong>Importer</strong></li>
          </ol>
        </div>
        <div style={{marginTop:10, fontSize:11, color:'#8B95A5'}}>
          ✅ Sauvegarde automatique en continu (localStorage)<br/>
          📊 {remplacements.length} remplacements · {cabinets.length} cabinets
        </div>
      </div>

      {/* Dashboard IA */}
      <div style={{background:'linear-gradient(135deg, #082B66 0%, #1BC7C9 100%)', borderRadius:14, padding:16, marginBottom:14, color:'#fff'}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10}}>
          <h3 style={{fontSize:15, fontWeight:700, margin:0}}>🤖 Assistant IA</h3>
          <button onClick={()=>setShowIA(!showIA)} style={{background:'rgba(255,255,255,0.2)', border:'none', borderRadius:8, padding:'4px 10px', color:'#fff', fontSize:12, fontWeight:600, cursor:'pointer'}}>{showIA ? "Masquer" : "Afficher"}</button>
        </div>
        {showIA && (
          <div style={{display:'flex', flexDirection:'column', gap:10}}>
            <div style={{background:'rgba(255,255,255,0.1)', borderRadius:10, padding:12}}>
              <div style={{fontSize:11, opacity:.8, marginBottom:2}}>📈 Prévision revenus (moy. 3 mois)</div>
              <div style={{fontSize:20, fontWeight:800}}>{avgCAperMonth.toFixed(0)} €/mois</div>
              <div style={{fontSize:11, opacity:.8}}>→ ~{(avgCAperMonth*12).toFixed(0)} €/an estimé</div>
            </div>
            <div style={{background:'rgba(255,255,255,0.1)', borderRadius:10, padding:12}}>
              <div style={{fontSize:11, opacity:.8, marginBottom:2}}>🚗 Moyenne kilométrique</div>
              <div style={{fontSize:20, fontWeight:800}}>{avgKmPerMonth.toFixed(0)} km/mois</div>
            </div>
            {topCab && (
              <div style={{background:'rgba(255,255,255,0.1)', borderRadius:10, padding:12}}>
                <div style={{fontSize:11, opacity:.8, marginBottom:2}}>🏆 Cabinet le plus rentable</div>
                <div style={{fontSize:16, fontWeight:700}}>{topCab[0]}</div>
                <div style={{fontSize:12, opacity:.8}}>{topCab[1].toFixed(0)} € sur 3 mois</div>
              </div>
            )}
            <div style={{background:'rgba(255,255,255,0.1)', borderRadius:10, padding:12}}>
              <div style={{fontSize:11, opacity:.8, marginBottom:2}}>💡 Suggestion</div>
              <div style={{fontSize:12}}>
                {avgCAperMonth > 3000 ? "Excellente dynamique ! Pensez à optimiser les tournées pour réduire les km." :
                 avgCAperMonth > 1500 ? "Bonne activité. Diversifier les cabinets pourrait augmenter vos revenus." :
                 "Début d'activité — concentrez-vous sur 2-3 cabinets réguliers."}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// APP PRINCIPAL V1.1
// ═══════════════════════════════════════════════
const NAV = [
  { id:"dash", icon:"📊", label:"Accueil" },
  { id:"plan", icon:"📅", label:"Planning" },
  { id:"cabs", icon:"🏥", label:"Cabinets" },
  { id:"fin",  icon:"💶", label:"Finances" },
  { id:"km",   icon:"🚗", label:"Km" },
  { id:"soins",icon:"🩺", label:"Tournée" },
  { id:"set",  icon:"⚙️", label:"Réglages" },
];

function App() {
  const [page, setPage] = useState("dash");
  const [cabinets, setCabinets] = useStore("ri_cabinets", []);
  const [remplacements, setRemplacements] = useStore("ri_remplacements", []);
  const [params, setParams] = useStore("ri_params", { tarifJour:"300", careTypes: DEFAULT_CARE_TYPES });
  const [formOpen, setFormOpen] = useState(null);

  const emptyRepl = (date) => ({
    dateStart: date||"", dateEnd: date||"",
    startMatin:"", endMatin:"", startMidi:"", endMidi:"", startSoir:"", endSoir:"",
    start:"", end:"", date: date||"",
    cabinetId:"", status:"pending", amountPlanned:params.tarifJour||"", amountReceived:"",
    km:"", notes:"", trackPatients:false, patients:[]
  });

  function saveRepl(r) {
    if(r.id) setRemplacements(prev => prev.map(x => x.id===r.id ? r : x));
    else setRemplacements(prev => [...prev, { ...r, id:uid() }]);
    setFormOpen(null);
  }
  function delRepl(id) { setRemplacements(prev => prev.filter(x => x.id!==id)); setFormOpen(null); }
  function openForm(date) { setFormOpen({ mode:"new", data:emptyRepl(date) }); }

  return (
    <div style={{ background:"#F4F5F8", minHeight:"100vh", maxWidth:500, margin:"0 auto", paddingBottom:72, color:"#1A2332" }}>
      <div style={{ padding:"0 16px" }}>
        {page==="dash" && <Dashboard remplacements={remplacements} cabinets={cabinets} params={params} setPage={setPage} openForm={openForm} />}
        {page==="cabs" && <Cabinets cabinets={cabinets} setCabinets={setCabinets} remplacements={remplacements} setPage={setPage} />}
        {page==="plan" && <Planning remplacements={remplacements} setRemplacements={setRemplacements} cabinets={cabinets} onAdd={openForm} onEdit={(r)=>setFormOpen({mode:"edit",data:r})} />}
        {page==="fin" && <Finances remplacements={remplacements} setRemplacements={setRemplacements} cabinets={cabinets} setCabinets={setCabinets} />}
        {page==="km" && <Kilometres remplacements={remplacements} setRemplacements={setRemplacements} cabinets={cabinets} params={params} />}
        {page==="soins" && <ListingSoins remplacements={remplacements} setRemplacements={setRemplacements} cabinets={cabinets} params={params} />}
        {page==="set" && <Parametres params={params} setParams={setParams} remplacements={remplacements} cabinets={cabinets} />}
      </div>

      {formOpen && (
        <Modal title={formOpen.mode==="edit" ? "Modifier" : "Nouveau remplacement"} onClose={()=>setFormOpen(null)}>
          <ReplacementForm
            replacement={formOpen.data}
            cabinets={cabinets}
            params={params}
            onSave={saveRepl}
            onDelete={formOpen.mode==="edit" ? delRepl : null}
            onCancel={()=>setFormOpen(null)}
          />
        </Modal>
      )}

      {/* BARRE NAV */}
      <div style={{
        position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
        width:"100%", maxWidth:500, background:"#fff",
        borderTop:"1px solid #ECEEF2", display:"flex", justifyContent:"space-around",
        padding:"4px 0 env(safe-area-inset-bottom, 6px)", zIndex:50,
        boxShadow:'0 -2px 8px rgba(0,0,0,0.03)'
      }}>
        {NAV.map(n => {
          const active = page===n.id;
          return (
            <button key={n.id} onClick={()=>setPage(n.id)} style={{
              background:"none", border:"none", cursor:"pointer",
              display:"flex", flexDirection:"column", alignItems:"center", gap:1,
              padding:"4px 6px", borderRadius:8, color: active ? "#082B66" : "#8B95A5",
              transition:"color .15s"
            }}>
              <span style={{ fontSize:20 }}>{n.icon}</span>
              <span style={{ fontSize:9, fontWeight: active ? 700 : 500 }}>{n.label}</span>
              {active && <div style={{width:4, height:4, borderRadius:2, background:'#1BC7C9', marginTop:1}} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
